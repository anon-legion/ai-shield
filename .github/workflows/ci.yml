name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # fallow diffs changed files against the base branch, so it needs real history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `wxt prepare`, which generates .wxt/ — `bun run check` fails without it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Audit changed files
        run: bunx fallow@2 audit --base origin/${{ github.base_ref || 'dev' }} --fail-on-issues
